name: Node.js CI

on:
  pull_request:
    branches: [ master ]
  workflow_call:
    inputs:
      ref:
        description: "Immutable release commit to check (blank uses the workflow checkout)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: build (22.x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out verified quality source
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_SOURCE_SHA: ${{ inputs.ref }}
        run: node scripts/release/cli.mjs checkout-quality
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Audit production dependencies
        run: nix develop --command yarn npm audit --environment production --recursive --severity high
      - name: Build, lint, and test in the Nix sandbox
        run: nix flake check --print-build-logs
      - name: Build the runtime image
        run: nix build .#dockerImage --print-build-logs
      - name: Smoke test the image
        run: |
          docker load --input result
          bash scripts/smoke-container.sh jonocairns/dankbot:latest
